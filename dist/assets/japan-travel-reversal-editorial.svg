<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Travel habits that reverse in Japan</title><desc id="desc">Editorial comparison showing familiar overseas habits and the more useful action in Japan.</desc><rect width="1400" height="900" fill="#173127"/><text x="75" y="105" fill="#f1e8d5" font-family="Georgia,serif" font-size="70">The useful reversal</text><text x="75" y="160" fill="#c9bda7" font-family="Arial,sans-serif" font-size="24">FAMILIAR AT HOME → BETTER IN JAPAN</text><g font-family="Arial,sans-serif" font-size="30"><g transform="translate(75 225)"><rect width="1250" height="110" rx="18" fill="#29483d"/><text x="35" y="68" fill="#f1e8d5">Leave a tip</text><text x="505" y="68" fill="#d7b866">→</text><text x="585" y="68" fill="#f1e8d5">Pay the bill and say thank you</text></g><g transform="translate(75 355)"><rect width="1250" height="110" rx="18" fill="#29483d"/><text x="35" y="68" fill="#f1e8d5">Talk on the train</text><text x="505" y="68" fill="#d7b866">→</text><text x="585" y="68" fill="#f1e8d5">Message now; call later</text></g><g transform="translate(75 485)"><rect width="1250" height="110" rx="18" fill="#29483d"/><text x="35" y="68" fill="#f1e8d5">Keep shoes on indoors</text><text x="505" y="68" fill="#d7b866">→</text><text x="585" y="68" fill="#f1e8d5">Read the raised-floor boundary</text></g><g transform="translate(75 615)"><rect width="1250" height="110" rx="18" fill="#29483d"/><text x="35" y="68" fill="#f1e8d5">Carry every bag</text><text x="505" y="68" fill="#d7b866">→</text><text x="585" y="68" fill="#f1e8d5">Send the suitcase ahead</text></g></g><text x="75" y="825" fill="#c9bda7" font-family="Arial,sans-serif" font-size="20">JAPAN UNFOLDED · ORIGINAL EDITORIAL DIAGRAM · GENERAL PATTERNS HAVE EXCEPTIONS</text></svg>
