<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">How the Kuchisake-onna question branches</title><desc id="d">Editorial diagram comparing several recorded answer variants</desc><rect width="1200" height="760" rx="40" fill="#f7f0e4"/><text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#19241f">“Am I beautiful?”</text><path d="M600 100v90M600 190H215v85M600 190v85M600 190h385v85" fill="none" stroke="#7b2d27" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(55 275)"><rect width="320" height="190" rx="28" fill="#7b2d27"/><text x="160" y="58" fill="#f2c55c" font-size="30" font-weight="700">YES</text><text x="160" y="103" fill="white" font-size="22">The mask comes off.</text><text x="160" y="138" fill="white" font-size="22">The question repeats.</text></g><g transform="translate(440 275)"><rect width="320" height="190" rx="28" fill="#263f39"/><text x="160" y="58" fill="#f2c55c" font-size="30" font-weight="700">NO</text><text x="160" y="103" fill="white" font-size="22">In many tellings,</text><text x="160" y="138" fill="white" font-size="22">danger is immediate.</text></g><g transform="translate(825 275)"><rect width="320" height="190" rx="28" fill="#a95a3c"/><text x="160" y="58" fill="#fff3cb" font-size="30" font-weight="700">“SO-SO”</text><text x="160" y="103" fill="white" font-size="22">A later escape answer</text><text x="160" y="138" fill="white" font-size="22">in some variants.</text></g></g><path d="M215 465v90M600 465v90M985 465v90" stroke="#7b2d27" stroke-width="7"/><rect x="120" y="555" width="960" height="130" rx="30" fill="#19241f"/><text x="600" y="610" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#f2c55c">There is no universal safe answer.</text><text x="600" y="652" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="white">The branching rules reveal retelling—not a verified encounter protocol.</text></svg>
