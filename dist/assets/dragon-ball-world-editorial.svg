<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Seven orange spheres connecting Tokyo and Qiddiya</title><desc id="desc">An original editorial diagram about Dragon Ball's journey from Japanese manga to worldwide physical destinations.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17233f"/><stop offset="1" stop-color="#3c1642"/></linearGradient><radialGradient id="orb"><stop stop-color="#ffd55a"/><stop offset=".62" stop-color="#f58a24"/><stop offset="1" stop-color="#d43b28"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#sky)"/><path d="M140 700C430 430 635 760 820 500S1240 250 1480 410" fill="none" stroke="#f6d47c" stroke-width="8" stroke-dasharray="18 20" opacity=".7"/><g fill="url(#orb)" stroke="#ffdf77" stroke-width="8"><circle cx="210" cy="680" r="92"/><circle cx="410" cy="525" r="78"/><circle cx="625" cy="650" r="102"/><circle cx="815" cy="470" r="82"/><circle cx="1030" cy="360" r="96"/><circle cx="1240" cy="315" r="75"/><circle cx="1420" cy="410" r="108"/></g><g fill="#a81926" font-family="Georgia,serif" font-size="58" font-weight="700" text-anchor="middle"><text x="210" y="700">★</text><text x="410" y="545">★★</text><text x="625" y="670">★★★</text><text x="815" y="490">4</text><text x="1030" y="380">5</text><text x="1240" y="335">6</text><text x="1420" y="430">7</text></g><text x="110" y="155" fill="#fff8e8" font-family="Georgia,serif" font-size="92" font-weight="700">A WORLD JAPAN CREATED</text><text x="116" y="230" fill="#f6d47c" font-family="Arial,sans-serif" font-size="28" letter-spacing="8">TOKYO → EVERYWHERE → QIDDIYA</text><text x="110" y="900" fill="#fff" font-family="Arial,sans-serif" font-size="24">Original editorial diagram · Japan Unfolded · Not official Dragon Ball artwork</text></svg>
