<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Ten things to know before visiting Japan</title><desc id="desc">Editorial countdown graphic linking practical travel subjects from medicine and emergencies to transit cards.</desc><rect width="1600" height="1000" fill="#efe7d5"/><path d="M0 780 C310 680 520 850 790 730 S1260 590 1600 690" fill="none" stroke="#c5533e" stroke-width="22"/><g font-family="Arial,sans-serif" font-weight="700"><text x="90" y="110" fill="#173127" font-size="28" letter-spacing="6">JAPAN · BEFORE YOU GO</text><text x="90" y="300" fill="#173127" font-family="Georgia,serif" font-size="124">10 things nobody</text><text x="90" y="425" fill="#173127" font-family="Georgia,serif" font-size="124">explains at the gate.</text><text x="95" y="525" fill="#9b3d2f" font-size="35">MEDICINE · MONEY · BATHS · PHOTOS · DISASTERS · TRAINS</text></g><g transform="translate(95 610)" font-family="Arial,sans-serif"><g fill="#173127"><circle cx="70" cy="70" r="70"/><circle cx="245" cy="70" r="70"/><circle cx="420" cy="70" r="70"/><circle cx="595" cy="70" r="70"/><circle cx="770" cy="70" r="70"/><circle cx="945" cy="70" r="70"/><circle cx="1120" cy="70" r="70"/><circle cx="1295" cy="70" r="70"/></g><g fill="#efe7d5" font-size="38" font-weight="700" text-anchor="middle"><text x="70" y="83">薬</text><text x="245" y="83">¥</text><text x="420" y="83">♨</text><text x="595" y="83">靴</text><text x="770" y="83">写</text><text x="945" y="83">列</text><text x="1120" y="83">食</text><text x="1295" y="83">IC</text></g></g><text x="95" y="925" fill="#6d6558" font-family="Arial,sans-serif" font-size="24">COUNTDOWN FROM #10 TO THE ONE TOOL YOU WILL USE EVERY DAY</text><text x="1435" y="925" fill="#9b3d2f" font-family="Georgia,serif" font-size="70">10→1</text></svg>
