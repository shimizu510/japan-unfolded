<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Tatemae and honne are two overlapping social truths</title><desc id="desc">Editorial diagram showing public role and private feeling overlapping around relationship, setting, power and risk.</desc><rect width="1600" height="1000" fill="#f5f0e6"/><path d="M0 0h1600v210H0z" fill="#18211d"/><text x="90" y="105" fill="#fffdf8" font-family="Georgia,serif" font-size="62" font-weight="700">Not a mask. A relationship.</text><text x="92" y="158" fill="#e8b743" font-family="Arial,sans-serif" font-size="25" letter-spacing="4">AN EDITORIAL MAP OF TATEMAE + HONNE</text><circle cx="625" cy="560" r="285" fill="#ef4c3b" fill-opacity=".88"/><circle cx="975" cy="560" r="285" fill="#243b62" fill-opacity=".88"/><text x="390" y="500" fill="white" font-family="Georgia,serif" font-size="48" font-weight="700">TATEMAE</text><text x="420" y="548" fill="white" font-family="Arial,sans-serif" font-size="23">public position</text><text x="420" y="586" fill="white" font-family="Arial,sans-serif" font-size="23">role · duty · tact</text><text x="1050" y="500" fill="white" font-family="Georgia,serif" font-size="48" font-weight="700">HONNE</text><text x="1050" y="548" fill="white" font-family="Arial,sans-serif" font-size="23">private feeling</text><text x="1050" y="586" fill="white" font-family="Arial,sans-serif" font-size="23">desire · doubt · motive</text><text x="800" y="520" text-anchor="middle" fill="#fffdf8" font-family="Georgia,serif" font-size="29" font-weight="700">BOTH CAN</text><text x="800" y="556" text-anchor="middle" fill="#fffdf8" font-family="Georgia,serif" font-size="29" font-weight="700">BE TRUE</text><text x="800" y="596" text-anchor="middle" fill="#fffdf8" font-family="Arial,sans-serif" font-size="16">care + conflict</text><g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18211d"><rect x="130" y="870" width="280" height="58" rx="29" fill="#cce8d7"/><text x="270" y="907" text-anchor="middle">RELATIONSHIP</text><rect x="480" y="870" width="280" height="58" rx="29" fill="#cce8d7"/><text x="620" y="907" text-anchor="middle">SETTING</text><rect x="840" y="870" width="280" height="58" rx="29" fill="#cce8d7"/><text x="980" y="907" text-anchor="middle">POWER</text><rect x="1190" y="870" width="280" height="58" rx="29" fill="#cce8d7"/><text x="1330" y="907" text-anchor="middle">RISK</text></g></svg>
