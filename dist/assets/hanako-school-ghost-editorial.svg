<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">The third stall: an editorial Hanako-san school ghost illustration</title><desc id="d">An empty Japanese school corridor leads to three numbered restroom doors. The third is slightly open, with three red knock marks and no person shown.</desc><rect width="1600" height="1000" fill="#12201d"/><path d="M0 790 560 430h1040v570z" fill="#d9d0bc"/><path d="M0 0h1600v430H560L0 790z" fill="#233f39"/><path d="M160 0v660M420 0v500" stroke="#8aa39a" stroke-width="16" opacity=".42"/><path d="M560 430h1040" stroke="#f1c860" stroke-width="12"/><g font-family="system-ui,sans-serif" font-weight="800" text-anchor="middle"><g fill="#e8e2d4" stroke="#172622" stroke-width="12"><rect x="650" y="500" width="250" height="430" rx="10"/><rect x="945" y="500" width="250" height="430" rx="10"/><path d="M1240 500h250v430h-250z"/></g><g fill="#172622" font-size="72"><text x="775" y="610">1</text><text x="1070" y="610">2</text><text x="1365" y="610">3</text></g><g fill="#a84335"><circle cx="1305" cy="700" r="18"/><circle cx="1365" cy="700" r="18"/><circle cx="1425" cy="700" r="18"/></g><text x="205" y="862" fill="#f1c860" font-size="60">THREE KNOCKS</text><text x="205" y="925" fill="#fff" font-size="32">ONE STORY · MANY VERSIONS</text></g><path d="M1240 500 1490 540v390h-250z" fill="#101714" opacity=".62"/><circle cx="1450" cy="730" r="13" fill="#f1c860"/></svg>
