<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">How a school ghost story changes as it travels</title><desc id="d">An editorial flow diagram connects a school, a whispered rule, a changed local detail, magazines and films, and a new generation.</desc><rect width="1200" height="620" rx="36" fill="#f3ead8"/><path d="M150 310h900" stroke="#b14537" stroke-width="14" stroke-dasharray="5 28" stroke-linecap="round"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#17312b"><circle cx="150" cy="310" r="82"/><circle cx="450" cy="310" r="82"/><circle cx="750" cy="310" r="82"/><circle cx="1050" cy="310" r="82"/></g><g fill="#fff" font-size="25" font-weight="800"><text x="150" y="300">SCHOOL</text><text x="150" y="332">RUMOR</text><text x="450" y="300">LOCAL</text><text x="450" y="332">VARIANT</text><text x="750" y="300">BOOKS +</text><text x="750" y="332">SCREENS</text><text x="1050" y="300">NEW</text><text x="1050" y="332">TELLERS</text></g><g fill="#7b2d27" font-size="22"><text x="150" y="445">third stall?</text><text x="450" y="445">hand, voice, girl?</text><text x="750" y="445">shared nationwide</text><text x="1050" y="445">rules change again</text></g><text x="600" y="95" fill="#17312b" font-size="42" font-weight="800">FOLKLORE IS A GAME OF TRANSMISSION</text><text x="600" y="550" fill="#54635e" font-size="25">Editorial diagram · Japan Unfolded</text></g></svg>
