<title id="title">A one-day map of what to eat in Japan</title><desc id="desc">Editorial diagram connecting breakfast, set lunch, regional dinner and a seasonal sweet</desc><rect width="1600" height="1000" fill="#173127"/><circle cx="800" cy="500" r="350" fill="none" stroke="#f2c55c" stroke-width="4" stroke-dasharray="13 18"/><g fill="#fffdf8" font-family="system-ui,sans-serif"><text x="800" y="445" font-size="54" font-weight="900" text-anchor="middle">EAT THE DAY,</text><text x="800" y="510" font-size="54" font-weight="900" text-anchor="middle">THEN EAT THE MAP</text><text x="800" y="558" font-size="24" text-anchor="middle" fill="#d5e1db">Japan Unfolded · editorial guide</text></g><g font-family="system-ui,sans-serif" text-anchor="middle"><g transform="translate(350 230)"><circle r="145" fill="#e8b743"/><text y="-15" font-size="30" font-weight="900" fill="#17201a">MORNING</text><text y="30" font-size="24" fill="#17201a">rice · soup · fish</text></g><g transform="translate(1250 230)"><circle r="145" fill="#fffdf8"/><text y="-15" font-size="30" font-weight="900" fill="#a43e2f">LUNCH</text><text y="30" font-size="24" fill="#17201a">teishoku</text></g><g transform="translate(1250 770)"><circle r="145" fill="#a43e2f"/><text y="-15" font-size="30" font-weight="900" fill="#fff">NIGHT</text><text y="30" font-size="24" fill="#fff">local specialty</text></g><g transform="translate(350 770)"><circle r="145" fill="#d8eee3"/><text y="-15" font-size="30" font-weight="900" fill="#17201a">SEASON</text><text y="30" font-size="24" fill="#17201a">fruit · wagashi</text></g></g><g fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round"><path d="M493 230h235"/><path d="M872 230h235"/><path d="M1250 375v250"/><path d="M1107 770H872"/><path d="M728 770H493"/><path d="M350 625V375"/></g><text x="800" y="930" fill="#fffdf8" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">Original editorial diagram — not a restaurant menu or dietary prescription</text></svg>
