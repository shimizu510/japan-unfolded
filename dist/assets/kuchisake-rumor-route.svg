<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">A rumor built for movement</title><desc id="d">Timeline diagram of the late 1970s Kuchisake-onna rumor and its later media life</desc><rect width="1200" height="680" rx="38" fill="#18312c"/><text x="70" y="80" fill="#f5efe5" font-family="Georgia,serif" font-size="42">A rumor built for movement</text><path d="M120 340H1080" stroke="#f2c55c" stroke-width="8"/><g font-family="Arial,sans-serif"><g transform="translate(120)"><circle cy="340" r="25" fill="#d65343"/><text y="250" fill="#f2c55c" font-size="27" font-weight="700">LATE 1978</text><text y="286" fill="white" font-size="20">Gifu-area rumors</text></g><g transform="translate(410)"><circle cy="340" r="25" fill="#d65343"/><text y="405" fill="#f2c55c" font-size="27" font-weight="700">JAN 1979</text><text y="441" fill="white" font-size="20">early press records</text></g><g transform="translate(700)"><circle cy="340" r="25" fill="#d65343"/><text y="250" fill="#f2c55c" font-size="27" font-weight="700">SPRING–SUMMER</text><text y="286" fill="white" font-size="20">national child rumor</text></g><g transform="translate(1000)"><circle cy="340" r="25" fill="#d65343"/><text x="80" y="405" text-anchor="end" fill="#f2c55c" font-size="27" font-weight="700">AFTERLIFE</text><text x="80" y="441" text-anchor="end" fill="white" font-size="20">film, manga, internet</text></g></g><text x="600" y="585" text-anchor="middle" fill="#d8e4df" font-family="Arial,sans-serif" font-size="22">Children, print and broadcast did not carry one fixed script; each stage generated new details.</text></svg>
