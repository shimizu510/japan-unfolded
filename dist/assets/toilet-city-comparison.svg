<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="34" fill="#f5f0e6"/><text x="70" y="78" font-family="Arial" font-size="19" font-weight="700" letter-spacing="3" fill="#c83f32">NOT A CLEANLINESS LEAGUE TABLE</text><text x="70" y="126" font-family="Georgia" font-size="42" font-weight="700" fill="#18211d">Three cities. Three different toilet problems.</text><g font-family="Arial"><g transform="translate(55 180)"><rect width="345" height="430" rx="26" fill="#193b33"/><text x="28" y="52" font-weight="700" fill="#f2c55c">TOKYO / JAPAN</text><text x="28" y="118" font-family="Georgia" font-size="52" font-weight="700" fill="white">80.2%</text><text x="28" y="148" fill="white">households with spray seats</text><text x="28" y="225" font-family="Georgia" font-size="30" font-weight="700" fill="#f2c55c">17 designs</text><text x="28" y="255" fill="white">The Tokyo Toilet project</text><text x="28" y="320" font-size="18" font-weight="700" fill="white">Optimizes for</text><text x="28" y="352" fill="#d5e2de">dense everyday access</text><text x="28" y="380" fill="#d5e2de">comfort + accessibility</text></g><g transform="translate(427 180)"><rect width="345" height="430" rx="26" fill="#243b62"/><text x="28" y="52" font-weight="700" fill="#f2c55c">NEW YORK CITY</text><text x="28" y="118" font-family="Georgia" font-size="52" font-weight="700" fill="white">975</text><text x="28" y="148" fill="white">operational public restrooms</text><text x="28" y="225" font-family="Georgia" font-size="30" font-weight="700" fill="#f2c55c">1 : 8,697</text><text x="28" y="255" fill="white">restrooms to residents, June 2025</text><text x="28" y="320" font-size="18" font-weight="700" fill="white">Current challenge</text><text x="28" y="352" fill="#d8e1f0">increase basic availability</text><text x="28" y="380" fill="#d8e1f0">reach 2,120 by 2035</text></g><g transform="translate(799 180)"><rect width="345" height="430" rx="26" fill="#9f3b31"/><text x="28" y="52" font-weight="700" fill="#ffe17a">PARIS</text><text x="28" y="118" font-family="Georgia" font-size="52" font-weight="700" fill="white">435</text><text x="28" y="148" fill="white">public sanisettes being renewed</text><text x="28" y="225" font-family="Georgia" font-size="30" font-weight="700" fill="#ffe17a">free</text><text x="28" y="255" fill="white">automatic, self-cleaning network</text><text x="28" y="320" font-size="18" font-weight="700" fill="white">Optimizes for</text><text x="28" y="352" fill="#f5dedb">street-level automation</text><text x="28" y="380" fill="#f5dedb">turnover + clean cycles</text></g></g><text x="600" y="659" text-anchor="middle" font-family="Arial" font-size="14" fill="#5d665f">Definitions differ: figures explain system priorities, not which city is “best.”</text></svg>
