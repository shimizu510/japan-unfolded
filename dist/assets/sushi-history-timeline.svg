<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="t d">
<title id="t">How sushi changed from preservation to fast food</title><desc id="d">An editorial timeline showing fermented narezushi, edible rice, vinegared hayazushi, and Edo nigiri.</desc>
<rect width="1600" height="760" rx="46" fill="#17211d"/><text x="100" y="105" fill="#f4d06f" font-family="Georgia,serif" font-size="52">Sushi kept shortening the wait</text><text x="100" y="155" fill="#d8dfda" font-family="Arial,sans-serif" font-size="24">Not one invention, but a chain of changes in preservation, sourness and speed.</text>
<path d="M150 370H1450" stroke="#f4d06f" stroke-width="10" stroke-linecap="round"/>
<g font-family="Arial,sans-serif"><g transform="translate(170 0)"><circle cy="370" r="30" fill="#b84234"/><text y="255" fill="white" font-size="30" font-weight="700">Long fermentation</text><text y="300" fill="#d8dfda" font-size="22">Salted fish + cooked rice</text><text y="440" fill="#f4d06f" font-size="25" font-weight="700">NAREZUSHI</text><text y="478" fill="#d8dfda" font-size="21">Preserve the fish;</text><text y="510" fill="#d8dfda" font-size="21">rice could be discarded.</text></g>
<g transform="translate(530 0)"><circle cy="370" r="30" fill="#b84234"/><text y="255" fill="white" font-size="30" font-weight="700">Shorter fermentation</text><text y="300" fill="#d8dfda" font-size="22">Fish and rice eaten together</text><text y="440" fill="#f4d06f" font-size="25" font-weight="700">NAMA-NARE</text><text y="478" fill="#d8dfda" font-size="21">The rice becomes</text><text y="510" fill="#d8dfda" font-size="21">part of the meal.</text></g>
<g transform="translate(890 0)"><circle cy="370" r="30" fill="#b84234"/><text y="255" fill="white" font-size="30" font-weight="700">Vinegar replaces waiting</text><text y="300" fill="#d8dfda" font-size="22">Sour rice without fermentation</text><text y="440" fill="#f4d06f" font-size="25" font-weight="700">HAYAZUSHI</text><text y="478" fill="#d8dfda" font-size="21">“Fast sushi” enables</text><text y="510" fill="#d8dfda" font-size="21">new regional forms.</text></g>
<g transform="translate(1250 0)"><circle cy="370" r="30" fill="#b84234"/><text y="255" fill="white" font-size="30" font-weight="700">Edo, 1820s</text><text y="300" fill="#d8dfda" font-size="22">Hand-formed street food</text><text y="440" fill="#f4d06f" font-size="25" font-weight="700">NIGIRI</text><text y="478" fill="#d8dfda" font-size="21">Prepared toppings;</text><text y="510" fill="#d8dfda" font-size="21">quickly served.</text></g></g>
<text x="100" y="690" fill="#94a099" font-family="Arial,sans-serif" font-size="20">Japan Unfolded editorial diagram · Dates are approximate; forms overlapped and regional traditions continued.</text></svg>
